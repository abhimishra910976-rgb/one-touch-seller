<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One Touch Seller</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f4f7fb;
 color:#172033
}
button,input,select{font:inherit}
.login{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:linear-gradient(135deg,#071b2b,#075f63)
}
.card{
 width:100%;
 max-width:430px;
 background:white;
 padding:30px;
 border-radius:24px;
 box-shadow:0 20px 60px #0004
}
.logo{
 width:90px;height:90px;
 margin:auto auto 18px;
 border-radius:25px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:linear-gradient(135deg,#00b98b,#087cf5);
 color:white;font-size:27px;font-weight:bold
}
h1{text-align:center;margin:5px 0}
.sub{text-align:center;color:#687386;margin-bottom:25px}
input,select{
 width:100%;
 padding:13px;
 border:1px solid #d9e0e8;
 border-radius:11px;
 margin:7px 0 14px;
 background:white
}
.btn{
 width:100%;
 border:0;
 padding:13px;
 border-radius:11px;
 background:#087cf5;
 color:white;
 font-weight:bold;
 cursor:pointer
}
.msg{text-align:center;margin-top:12px;color:#d33}
.app{display:none;min-height:100vh}
.header{
 background:#09263a;
 color:white;
 padding:16px 20px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:15px
}
.header strong{font-size:20px}
.logout{
 border:1px solid #ffffff55;
 background:transparent;
 color:white;
 padding:8px 13px;
 border-radius:8px
}
.content{padding:20px;max-width:1200px;margin:auto}
.cards{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
 gap:15px
}
.stat{
 background:white;
 padding:20px;
 border-radius:16px;
 box-shadow:0 4px 18px #10204012
}
.stat b{font-size:25px;display:block;margin-top:8px}
.menu{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
 gap:12px;margin-top:20px
}
.menu button{
 padding:18px;
 border:0;
 border-radius:15px;
 background:white;
 box-shadow:0 4px 18px #10204012;
 text-align:left;
 cursor:pointer
}
.panel{
 display:none;
 margin-top:20px;
 background:white;
 padding:20px;
 border-radius:18px
}
.row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:15px
}
.list{
 margin-top:15px
}
.item{
 padding:12px;
 border-bottom:1px solid #eee
}
@media(max-width:600px){
 .row{grid-template-columns:1fr}
 .content{padding:12px}
 .header{padding:13px}
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="login" class="login">
<div class="card">

<div class="logo">OTS</div>

<h1>One Touch Seller</h1>
<p class="sub">Private Business Management System</p>

<label>Email</label>
<input id="email" type="email" placeholder="Your email">

<label>Password</label>
<input id="password" type="password" placeholder="Your password">

<button class="btn" onclick="login()">Login</button>

<div id="loginMsg" class="msg"></div>

</div>
</section>


<!-- APP -->
<section id="app" class="app">

<header class="header">
<strong>ONE TOUCH SELLER</strong>
<button class="logout" onclick="logout()">Logout</button>
</header>

<main class="content">

<h2>Business Dashboard</h2>

<div class="cards">

<div class="stat">
Production
<b id="productionCount">0</b>
</div>

<div class="stat">
Sales
<b id="salesCount">0</b>
</div>

<div class="stat">
Products
<b id="productCount">0</b>
</div>

<div class="stat">
Sizes
<b id="sizeCount">0</b>
</div>

</div>


<div class="menu">

<button onclick="openPanel('productPanel')">
📦 <b>Products & Sizes</b><br>
Add product and size
</button>

<button onclick="alert('Production module next')">
🏭 <b>Production</b><br>
Production entry
</button>

<button onclick="alert('Stock module next')">
📊 <b>Stock</b><br>
View stock
</button>

<button onclick="alert('Sales module next')">
🛒 <b>Sales</b><br>
Sales entry
</button>

<button onclick="alert('Purchase module next')">
🚚 <b>Purchase</b><br>
Purchase entry
</button>

<button onclick="alert('Wastage module next')">
♻️ <b>Wastage / Damage</b><br>
Damage tracking
</button>

</div>


<!-- PRODUCT PANEL -->
<div id="productPanel" class="panel">

<h2>Product & Size Master</h2>

<div class="row">

<div>
<label>Product Name</label>
<input id="productName" placeholder="Example: Paper Plate">
<button class="btn" onclick="addProduct()">+ Add Product</button>
</div>

<div>
<label>Size</label>
<input id="sizeName" placeholder="Example: 14 inch">
<button class="btn" onclick="addSize()">+ Add Size</button>
</div>

</div>

<hr>

<h3>Products</h3>
<div id="productsList" class="list"></div>

<h3>Sizes</h3>
<div id="sizesList" class="list"></div>

</div>

</main>
</section>


<script>

/* =========================
SUPABASE
========================= */

const SUPABASE_URL =
"https://dhqhtmxbqarlcdkuqcbg.supabase.co/rest/v1/";

"sb_publishable_QQCZaolNSV_fC_aDE__UpA_u-x3grcc";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
LOGIN
========================= */

async function login(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const msg =
document.getElementById("loginMsg");

if(!email || !password){
msg.textContent="Email और password भरें";
return;
}

const {error} =
await supabaseClient.auth.signInWithPassword({
email,
password
});

if(error){
msg.textContent=error.message;
return;
}

showApp();
}


/* =========================
SESSION
========================= */

async function checkSession(){

const {data} =
await supabaseClient.auth.getSession();

if(data.session){
showApp();
}
}

function showApp(){

document.getElementById("login")
.style.display="none";

document.getElementById("app")
.style.display="block";

loadData();
}

async function logout(){

await supabaseClient.auth.signOut();

location.reload();
}


/* =========================
PRODUCT
========================= */

async function addProduct(){

const name =
document.getElementById("productName")
.value.trim();

if(!name){
alert("Product name डालें");
return;
}

const {data:{user}} =
await supabaseClient.auth.getUser();

const {error} =
await supabaseClient
.from("products")
.insert({
owner_id:user.id,
name:name
});

if(error){
alert(error.message);
return;
}

document.getElementById("productName").value="";

loadData();
}


/* =========================
SIZE
========================= */

async function addSize(){

const name =
document.getElementById("sizeName")
.value.trim();

if(!name){
alert("Size डालें");
return;
}

const {data:{user}} =
await supabaseClient.auth.getUser();

const {error} =
await supabaseClient
.from("product_sizes")
.insert({
owner_id:user.id,
size_name:name,
unit:"inch"
});

if(error){
alert(error.message);
return;
}

document.getElementById("sizeName").value="";

loadData();
}


/* =========================
LOAD DATA
========================= */

async function loadData(){

const {data:{user}} =
await supabaseClient.auth.getUser();

if(!user)return;


/* PRODUCTS */

const {data:products} =
await supabaseClient
.from("products")
.select("*")
.order("created_at",{ascending:false});

document.getElementById("productCount")
.textContent=products?.length || 0;

document.getElementById("productsList")
.innerHTML=(products||[])
.map(p=>`
<div class="item">
📦 ${escapeHtml(p.name)}
</div>
`).join("") || "कोई product नहीं";


/* SIZES */

const {data:sizes} =
await supabaseClient
.from("product_sizes")
.select("*")
.order("created_at",{ascending:false});

document.getElementById("sizeCount")
.textContent=sizes?.length || 0;

document.getElementById("sizesList")
.innerHTML=(sizes||[])
.map(s=>`
<div class="item">
📏 ${escapeHtml(s.size_name)}
</div>
`).join("") || "कोई size नहीं";


/* SALES COUNT */

const {count:salesCount} =
await supabaseClient
.from("sales")
.select("*",{count:"exact",head:true});

document.getElementById("salesCount")
.textContent=salesCount || 0;


/* PRODUCTION COUNT */

const {count:productionCount} =
await supabaseClient
.from("production_batches")
.select("*",{count:"exact",head:true});

document.getElementById("productionCount")
.textContent=productionCount || 0;

}


/* =========================
PANEL
========================= */

function openPanel(id){

document.getElementById(id)
.style.display="block";

}


/* =========================
SAFE TEXT
========================= */

function escapeHtml(text){

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}


checkSession();

</script>

</body>
</html>
